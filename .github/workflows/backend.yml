# Backend CI: formatting, Error Prone, ArchUnit, and all test tiers (`./gradlew check`), then the harness.
# dbTest uses Testcontainers, so the runner needs Docker (ubuntu-latest has it). Without Docker dbTest fails; it is never skipped.
# Actions are pinned to commit SHAs, with the release tag in a comment. When upgrading, pin the new tag's commit SHA the same way.
name: backend

on:
  pull_request:
    # labeled: pitest 라벨을 붙이는 순간 변이 테스트 job이 돈다(다음 push를 기다리지 않는다)
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "backend/**"
      - "harness/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "harness/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: backend check (spotless·Error Prone·ArchUnit·test·dbTest·프로세스)
    runs-on: ubuntu-latest # Docker 내장 — Testcontainers pgvector/pgvector:pg17
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: check + bootJar + harnessJar
        working-directory: backend
        run: ./gradlew --no-daemon check bootJar harnessJar
      - name: harness (포맷 + 자체 테스트 + Java 실행 JAR 비교)
        working-directory: harness
        run: ./gradlew --no-daemon spotlessCheck test javaTest
      - name: 테스트 보고 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            backend/**/build/reports/tests
            backend/**/build/test-results
            harness/build/reports/tests
          retention-days: 14

  pitest:
    name: 변이 테스트(ratchet)
    # Only on manual runs and on PRs labelled `pitest`; mutation testing is not part of check
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'pitest')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: pitest (mutationThreshold 96 · testStrengthThreshold 96)
        working-directory: backend
        run: ./gradlew --no-daemon pitest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pitest-report
          path: backend/verification/build/reports/pitest
          retention-days: 14
