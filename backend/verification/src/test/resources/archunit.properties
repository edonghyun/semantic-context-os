# 코딩 규약 규칙(ConventionRulesTest)·로깅 규칙(LoggingRulesTest)의 고정 위반 저장소(TESTING §13.2). 경로는 작업 디렉터리(backend) 기준 — 테스트는 backend에서 돈다.
freeze.store.default.path=verification/src/test/resources/frozen
# ratchet: 저장소가 새 위반을 받아들이지 않는다. 저장소가 없으면 실패하고(만들지 않는다), 고친 위반이 생기면 실패한다(목록 갱신 요구).
# 갱신은 `./gradlew :verification:fastTest --tests io.scos.ConventionRulesTest -Pscos.freeze.update=true` — 고친 위반만 지운다.
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
freeze.refreeze=false
